<style>
:root{--maroon:#6B2308;--maroon2:#4A1405;--gold:#B08D3C;--gold2:#E7D3A0;--ivory:#FBF7EE;--ink:#2A1A12;--navy:#12303F;--line:#E6DCC4;--ok:#2F5D3A;
--ui:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--ui);color:var(--ink);background:#EFE7D4;display:flex;flex-direction:column;height:100dvh;overflow:hidden;font-size:15px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* top bar */
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:linear-gradient(#7A2B0C,#5A1B06);color:#F8EBC6;box-shadow:0 2px 10px rgba(0,0,0,.25);z-index:5}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.brand img{width:34px;height:34px;flex:none}
.brand b{font-family:"Playfair Display",Georgia,serif;font-size:1.05rem;letter-spacing:.02em;white-space:nowrap}
.brand small{display:block;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2);opacity:.85}
.tb{border:1px solid rgba(231,211,160,.45);background:rgba(255,255,255,.07);color:#F8EBC6;border-radius:10px;padding:8px 11px;font-weight:600;font-size:.85rem;display:inline-flex;align-items:center;gap:6px;min-height:38px}
.tb:active{transform:scale(.97)}
.tb:disabled{opacity:.35}
.tb.gold{background:linear-gradient(#E3C66F,#B08D3C);border-color:#E3C66F;color:#3A1204}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media(max-width:560px){.tb .lbl{display:none}.brand small{display:none}}
/* workspace */
.work{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{flex:1 1 52%;min-height:180px;overflow:auto;display:flex;padding:12px;background:radial-gradient(circle at 50% 0,#F5EEDB,#E6DCC2);position:relative}
.stage .holder{margin:auto;position:relative;box-shadow:0 10px 36px rgba(60,30,10,.28),0 0 0 1px rgba(0,0,0,.06);background:#fff;line-height:0}
#cv{display:block;touch-action:none;cursor:default;user-select:none;-webkit-user-select:none}
.zoombar{position:absolute;right:10px;bottom:10px;display:none;gap:4px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
@media(pointer:fine){.zoombar{display:flex}}
.zoombar button{border:0;background:transparent;border-radius:8px;padding:5px 9px;font-weight:700}
.zoombar button:hover{background:#F3EAD3}
.panel{flex:1 1 48%;min-height:0;background:var(--ivory);border-top:2px solid var(--gold);display:flex;flex-direction:column;box-shadow:0 -6px 18px rgba(60,30,10,.12)}
.tabs{display:flex;gap:2px;padding:6px 8px 0;background:#F5EEDB;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:transparent;padding:9px 14px;border-radius:10px 10px 0 0;font-weight:600;color:#7a6a58;white-space:nowrap;border-bottom:3px solid transparent}
.tab.on{background:var(--ivory);color:var(--maroon);border-bottom-color:var(--gold)}
.pbody{flex:1;overflow:auto;padding:12px 12px calc(16px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
@media(min-width:900px){
 .work{flex-direction:row}
 .stage{flex:1 1 auto;padding:22px}
 .panel{flex:0 0 380px;border-top:0;border-left:2px solid var(--gold);box-shadow:-6px 0 18px rgba(60,30,10,.1)}
}
/* controls */
.sec{margin:0 0 14px}
.sec h4{margin:0 0 8px;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:#8a6d2e}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 8px;font-weight:600;font-size:.84rem;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;line-height:1.2;color:var(--ink)}
.chip:hover{border-color:var(--gold)}
.chip:active{transform:scale(.97);background:#FAF1D8}
.chip .ico{width:22px;height:22px;color:var(--maroon)}
.row{display:flex;gap:8px;align-items:center;margin:0 0 9px;flex-wrap:wrap}
.row>label{font-size:.78rem;font-weight:600;color:#6d5b48;min-width:74px}
.row.full>*{flex:1}
input[type=text],input[type=number],select,textarea{border:1px solid #D9CCAC;background:#fff;border-radius:10px;padding:9px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px;line-height:1.45}
input[type=number]{width:84px}
input[type=range]{flex:1;min-width:110px;accent-color:var(--maroon)}
input[type=color]{width:44px;height:38px;border:1px solid #D9CCAC;border-radius:10px;padding:2px;background:#fff;flex:none}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw i{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #cdbf9e;cursor:pointer;display:block}
.seg{display:inline-flex;border:1px solid #D9CCAC;border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:8px 12px;font-weight:700;min-width:40px;border-right:1px solid #eadfc6}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--maroon);color:#F8EBC6}
.btn{border:1px solid #D9CCAC;background:#fff;border-radius:10px;padding:9px 13px;font-weight:600}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(#8C3512,#6B2308);color:#F8EBC6;border-color:#6B2308}
.btn.gold{background:linear-gradient(#E3C66F,#B08D3C);border-color:#B08D3C;color:#3A1204}
.btn.dng{color:#9b1c1c;border-color:#e0b4b4}
.hint{font-size:.8rem;color:#7a6a58;line-height:1.45;background:#FFF9E8;border:1px dashed #D8BF7A;border-radius:10px;padding:9px 11px;margin:0 0 12px}
.layer{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);background:#fff;border-radius:10px;margin-bottom:6px}
.layer.on{border-color:var(--maroon);background:#FFF4E6}
.layer .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.85rem;font-weight:600}
.layer .ty{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:#9a8660}
.layer button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 8px;font-weight:700}
/* modals */
.modal{position:fixed;inset:0;background:rgba(30,12,4,.62);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal.on{display:flex}
.sheet{background:var(--ivory);border-radius:18px;max-width:880px;width:100%;max-height:92dvh;display:flex;flex-direction:column;border:2px solid var(--gold);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet header b{font-family:"Playfair Display",Georgia,serif;font-size:1.2rem;color:var(--maroon)}
.sheet .x{border:0;background:#F3EAD3;border-radius:50%;width:34px;height:34px;font-size:1.1rem;font-weight:700}
.sheet .sb{padding:14px 16px 18px;overflow:auto}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tcard{border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px;text-align:center;font-weight:600;font-size:.85rem}
.tcard:hover{border-color:var(--gold);box-shadow:0 6px 18px rgba(80,40,10,.15)}
.tcard canvas{width:100%;height:auto;border-radius:6px;display:block;margin-bottom:6px;background:#f3ecd9;border:1px solid #e3d8bd}
.tcard small{display:block;font-weight:500;color:#8a7a62;font-size:.72rem}
.pv{background:#e9dfc8;border-radius:12px;padding:10px;text-align:center;margin-bottom:12px}
.pv img{max-width:100%;max-height:44dvh;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.25);-webkit-touch-callout:default;user-select:auto}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#3A1204;color:#F8EBC6;padding:10px 16px;border-radius:12px;font-weight:600;font-size:.88rem;opacity:0;pointer-events:none;transition:.3s;z-index:80;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.dropmask{position:absolute;inset:0;background:rgba(107,35,8,.18);border:3px dashed var(--maroon);display:none;align-items:center;justify-content:center;font-weight:700;color:var(--maroon);font-size:1.2rem;z-index:3}
.dropmask.on{display:flex}
</style>
</head>

function regAsset(url,id){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{id=id||("a"+uid());assets[id]={url,img};res(id)};img.onerror=()=>rej(new Error("bad image"));img.src=url})}

  g.innerHTML=TEMPLATES.map((t,i)=>`<button class="tcard" data-i="${i}"><canvas></canvas>${esc(t.name)}<small>${esc(t.desc)}</small></button>`).join("");

function loadTemplate(t){
 const st=t.build();S.page=st.page;S.els=st.els;S.sel=null;zoomMul=1;

}

/* ---------- export ---------- */
const blobOf=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));
async function allFonts(){
 try{await Promise.all(S.els.filter(e=>e.type==="text").map(e=>document.fonts.load(fontStr(e),e.text||"A")));await document.fonts.ready}catch(x){}
}
async function buildExport(){
 await allFonts();
 let mult=+$("#qSel").value;const P=S.page,maxPx=16e6;
 if(P.w*P.h*mult*mult>maxPx)mult=Math.sqrt(maxPx/(P.w*P.h));
 const c=document.createElement("canvas");c.width=Math.round(P.w*mult);c.height=Math.round(P.h*mult);
 renderState(c.getContext("2d"),S,c.width/P.w,{});
 return c;
}
let pvUrl=null;
async function openExport(){
 $("#mExp").classList.add("on");$("#pv").textContent="Preparing…";$("#pvInfo").textContent="";
 select(null,true);
 try{
  expCanvas=await buildExport();
  const b=await blobOf(expCanvas,"image/png");
  if(pvUrl)URL.revokeObjectURL(pvUrl);pvUrl=URL.createObjectURL(b);
  $("#pv").innerHTML="";const im=new Image();im.src=pvUrl;im.alt="Your design";$("#pv").appendChild(im);
  const P=S.page,a4=(P.w===1123||P.w===794)&&(P.h===794||P.h===1123);
  const empties=S.els.filter(e=>e.type==="image"&&!e.src).length;
  $("#pvInfo").innerHTML=`Size: <b>${expCanvas.width} × ${expCanvas.height} px</b>${a4?` (about ${Math.round(expCanvas.width/(P.w/96))} dpi on A4)`:""}. On a phone, press and hold the picture to save it, or use the buttons below.`+(empties?`<br><b>Note:</b> ${empties} empty photo frame${empties>1?"s":""} will be blank — add a picture or delete the frame.`:"");
 }catch(x){$("#pv").textContent="Could not prepare the image. Try a lower quality.";}
}
function fname(ext){const d=new Date(),p=n=>String(n).padStart(2,"0");return `AWN-design-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.${ext}`}
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
async function makePDF(c,wpt,hpt){
 const jb=await blobOf(c,"image/jpeg",.95),jpg=new Uint8Array(await jb.arrayBuffer()),enc=new TextEncoder(),parts=[],offs=[];let off=0;
 const push=x=>{const b=typeof x==="string"?enc.encode(x):x;parts.push(b);off+=b.length};
 push("%PDF-1.4\n");
 offs[1]=off;push("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
 offs[2]=off;push("2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n");
 offs[3]=off;push(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${wpt} ${hpt}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`);
 offs[4]=off;push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${c.width} /Height ${c.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);push(jpg);push("\nendstream\nendobj\n");
 const cs=`q ${wpt} 0 0 ${hpt} 0 0 cm /Im0 Do Q`;
 offs[5]=off;push(`5 0 obj\n<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
 const xr=off;let x="xref\n0 6\n0000000000 65535 f \n";for(let i=1;i<=5;i++)x+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
 push(x);push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
 return new Blob(parts,{type:"application/pdf"});
}

$("#dPdf").onclick=async()=>{if(!expCanvas)return;const P=S.page;dl(await makePDF(expCanvas,+(P.w*.75).toFixed(2),+(P.h*.75).toFixed(2)),fname("pdf"))};

document.addEventListener("keydown",ev=>{
 const t=ev.target,typing=t&&t.matches&&t.matches("input,textarea,select"),mod=ev.ctrlKey||ev.metaKey;
 if(mod&&ev.key.toLowerCase()==="s"){ev.preventDefault();openExport();return}
 if(typing)return;
 if(mod&&ev.key.toLowerCase()==="z"){ev.preventDefault();ev.shiftKey?redo():undo();return}
 if(mod&&ev.key.toLowerCase()==="y"){ev.preventDefault();redo();return}
 if(mod&&ev.key.toLowerCase()==="d"){ev.preventDefault();dup();return}
 const e=E();if(!e)return;
 if(ev.key==="Delete"||ev.key==="Backspace"){ev.preventDefault();del();return}
 if(ev.key==="Escape"){select(null);return}
 const d=ev.shiftKey?10:1,mv={ArrowLeft:[-d,0],ArrowRight:[d,0],ArrowUp:[0,-d],ArrowDown:[0,d]}[ev.key];
 if(mv&&!e.locked){ev.preventDefault();e.x+=mv[0];e.y+=mv[1];rq();commitSoon()}
});

})();
})();
